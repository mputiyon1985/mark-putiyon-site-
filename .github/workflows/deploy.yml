name: Test and deploy

# Pull requests: run tests, then deploy a preview.
# Pushes to main: run tests, then deploy to production only if they are green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # These two IDs identify the Vercel project; they are not credentials.
  # The only secret needed is VERCEL_TOKEN.
  VERCEL_ORG_ID: team_wxZVNJKn11EBhoxPuTP0s8Rb
  VERCEL_PROJECT_ID: prj_hMVFcxldVMOhA1ilAPIhw4m42wyP

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site checks
        run: node scripts/check-site.mjs

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy preview
        run: vercel deploy --yes --token "${{ secrets.VERCEL_TOKEN }}"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy to production
        run: vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
